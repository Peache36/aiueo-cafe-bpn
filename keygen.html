<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Pembuat kunci Push</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:680px;margin:24px auto;padding:0 16px;color:#222}
button{padding:10px 18px;font-size:15px;border:0;border-radius:8px;background:#A8541F;color:#fff}
textarea{width:100%;box-sizing:border-box;font:12px monospace;padding:8px}label{display:block;margin-top:14px;font-weight:600}</style></head>
<body>
<h2>Pembuat kunci Web Push</h2>
<p>Kunci dibuat <b>di perangkat Anda sendiri</b> (tidak dikirim ke mana pun). Tekan tombol, lalu salin nilainya sesuai petunjuk di bawah. Setelah selesai, <b>hapus file ini dari situs</b> agar tidak ada yang bisa ikut membuat kunci.</p>
<button id="go">Buat kunci baru</button>
<div id="out" hidden>
<label>VAPID_PUBLIC → Netlify env var DAN kolom "Kunci publik" di Admin app</label><textarea id="pub" rows="2" readonly></textarea>
<label>VAPID_PRIVATE → Netlify env var saja (RAHASIA)</label><textarea id="priv" rows="2" readonly></textarea>
<label>PUSH_SECRET → Netlify env var DAN kolom "Secret" di Admin app</label><textarea id="sec" rows="2" readonly></textarea>
<label>VAPID_SUBJECT → Netlify env var (isi dengan email Anda)</label><textarea rows="1" readonly>mailto:email-anda@contoh.com</textarea>
</div>
<script>
function b64u(buf){var s='';new Uint8Array(buf).forEach(function(c){s+=String.fromCharCode(c)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
document.getElementById('go').onclick=async function(){
  var kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  var jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);
  function d(x){x=x.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';var b=atob(x),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  var x=d(jwk.x),y=d(jwk.y),pub=new Uint8Array(65);pub[0]=4;pub.set(x,1);pub.set(y,33);
  document.getElementById('pub').value=b64u(pub);
  document.getElementById('priv').value=jwk.d;
  document.getElementById('sec').value=b64u(crypto.getRandomValues(new Uint8Array(24)));
  document.getElementById('out').hidden=false;
};
</script></body></html>
